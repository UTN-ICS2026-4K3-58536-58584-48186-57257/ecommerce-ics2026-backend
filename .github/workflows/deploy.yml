
name: CI/CD Pipeline

on:
  push:
    branches: [main, master, development]

  pull_request:
    branches: [main, master, development]

  workflow_dispatch:

env:
  IMAGE_NAME: dsw2025tpi-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Configurar .NET 8
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar dependencias
      - name: Restaurar paquetes
        run: dotnet restore

      # 4. Compilar proyecto
      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # 5. Ejecutar pruebas automatizadas
      - name: Ejecutar pruebas
        run: dotnet test --configuration Release --no-build --verbosity normal

      # 6. Iniciar sesión en Docker Hub
      - name: Iniciar sesión en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Construir imagen Docker
      - name: Construir imagen Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile .

      # 8. Publicar imagen en Docker Hub
      - name: Publicar imagen en Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 9. Desplegar en Azure App Service
      - name: Desplegar en Azure App Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
