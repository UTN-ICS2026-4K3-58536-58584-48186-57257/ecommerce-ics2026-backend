name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]

jobs:
  # ==================================================================
  # JOB 1: Quality Gate - pruebas automatizadas
  # ==================================================================
  run-tests:
    name: Quality Gate - Pruebas Unitarias e Integración
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restaurar paquetes
      run: dotnet restore

    - name: Compilar
      run: dotnet build --no-restore --configuration Release

    - name: Ejecutar pruebas
      run: dotnet test --no-build --configuration Release --verbosity normal

  # ==================================================================
  # JOB 2: Imagen Docker (solo corre si run-tests termina bien)
  # ==================================================================
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Construir imagen Docker
      run: docker build -t mi-api-app:${{ github.sha }} .
